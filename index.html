<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Pricing Page - Practice</title>
  <!-- found this font on google fonts, looks pretty clean -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <p class="small-tag">Pricing Plans</p>
    <h1>Pick a plan that works for you</h1>
    <p class="subtitle">
      No hidden fees or weird stuff. Just trying to build a clean pricing table with CSS Grid and Flexbox.
    </p>
  </header>

  <main class="container">
    <!-- 3 tier pricing cards -->
    <section class="pricing-cards" aria-label="Pricing plans">

      <!-- Tier 1: Starter -->
      <article class="card">
        <div class="card-top">
          <h2>Starter</h2>
          <p class="plan-desc">Good if you are just messing around with side projects.</p>
          <p class="price">
            <span class="dollar">$</span>0
            <span class="per">/ month</span>
          </p>
        </div>

        <!-- using dl because i read its better for key-value pairs -->
        <dl class="card-features">
          <div class="feature-row">
            <dt>Projects</dt>
